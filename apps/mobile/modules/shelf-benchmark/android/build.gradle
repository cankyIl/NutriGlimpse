plugins { id 'com.android.library'; id 'expo-module-gradle-plugin' }
group = 'expo.modules.shelfbenchmark'
version = '0.1.0'
android { namespace 'expo.modules.shelfbenchmark'; defaultConfig { versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' } }
configurations.configureEach {
  resolutionStrategy.force name.endsWith('RuntimeClasspath') ? 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava' : 'com.google.guava:listenablefuture:1.0'
}
dependencies {
  implementation 'androidx.camera:camera-core:1.6.0'
  implementation 'androidx.camera:camera-camera2:1.6.0'
  implementation 'androidx.camera:camera-lifecycle:1.6.0'
  implementation 'androidx.camera:camera-view:1.6.0'
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
